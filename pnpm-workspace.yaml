# Protect against package ecosystem threats
minimumReleaseAge: 1440 # only install things that are at least one day old
trustPolicy: no-downgrade # never install anything where the publication provenance is less than it was
trustPolicyIgnoreAfter: 43200 # ignore things older than 30 days, some of our transitive dependencies are over this threshold
blockExoticSubdeps: true # block installing things not from the registry

allowBuilds:
  esbuild: false

# Docs: https://pnpm.io/settings
# https://github.com/emberjs/rfcs/pull/907

# we don't want addons to be bad citizens of the ecosystem
autoInstallPeers: false

# we want true isolation,
# if a dependency is not declared, we want an error
resolvePeersFromWorkspaceRoot: false
